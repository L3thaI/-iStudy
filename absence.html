<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iStudy — حاسبة الغياب</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { cairo: ['Cairo', 'sans-serif'] },
          colors: {
            ksu: {
              50: '#f0f7ff', 100: '#e0effe', 200: '#b9dffd',
              500: '#0c8ae6', 600: '#006dc4', 700: '#01579f', 800: '#064a83',
            },
          },
        },
      },
    };
  </script>
  <style>body { font-family: 'Cairo', sans-serif; }</style>
</head>
<body class="bg-ksu-50 text-slate-800 min-h-screen">

  <header class="bg-white border-b border-ksu-100">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="index.html" class="text-sm text-ksu-600 hover:text-ksu-800 font-medium flex items-center gap-1 transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        الرئيسية
      </a>
      
      <!-- الشعار الجديد (بدون النص وبأبعاد متناسقة) -->
      <a href="index.html" class="flex items-center justify-center outline-none">
        <img src="logo.jpg" alt="شعار iStudy" class="w-24 sm:w-28 h-auto object-contain mix-blend-multiply">
      </a>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 py-10">
    <h1 class="text-2xl font-bold text-ksu-900 mb-1">حاسبة الغياب</h1>
    <p class="text-slate-500 text-sm mb-8">النسبة المسموحة للغياب قبل الحرمان: 25% (محسوبة على 15 أسبوع)</p>

    <div class="bg-white rounded-2xl border border-ksu-100 p-6 sm:p-8">
      <div class="space-y-5 mb-6">
        <div>
          <label for="course-hours" class="block text-sm font-medium text-slate-700 mb-2">عدد ساعات المادة (أسبوعياً)</label>
          <input type="number" id="course-hours" min="1" placeholder="مثال: 3"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-ksu-400 focus:ring-2 focus:ring-ksu-100 outline-none text-left" dir="ltr">
        </div>
        <div>
          <label for="absent-hours" class="block text-sm font-medium text-slate-700 mb-2">عدد الساعات التي غبتها حتى الآن</label>
          <input type="number" id="absent-hours" min="0" placeholder="مثال: 4"
            class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:border-ksu-400 focus:ring-2 focus:ring-ksu-100 outline-none text-left" dir="ltr">
        </div>
      </div>

      <button id="calc-absence-btn"
        class="w-full py-3 bg-ksu-600 text-white rounded-xl font-semibold hover:bg-ksu-700 transition-colors">
        احسب النسبة
      </button>

      <div id="absence-result" class="hidden mt-6 p-5 rounded-xl border">
        <p id="absence-message" class="font-semibold"></p>
        <p id="absence-details" class="text-sm mt-2 opacity-90 leading-relaxed whitespace-pre-line"></p>
      </div>
    </div>
  </main>

  <script src="absence.js"></script>
</body>
</html>
